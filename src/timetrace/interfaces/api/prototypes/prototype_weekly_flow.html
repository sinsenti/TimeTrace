<!doctype html>
<!-- THROWAWAY #64: combined weekly overview (A) → guided review (C), ?variant=A|C.
Synthetic data only; no application imports, persistence, provider calls or production routes.
Run: python3 -P -m http.server 18064 --bind 127.0.0.1 --directory src/timetrace/interfaces/api/prototypes
Separate-screen placement and report contents are proposals, not production acceptance. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimeTrace · Overview and guided review prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#101219);color:var(--foreground,#e8eaf2);font:14px system-ui,sans-serif}.mock{--bg:#101219;--panel:#191d28;--line:#303647;--text:#e8eaf2;--dim:#a6adc0;--purple:#b6a0ff;--green:#76d8bb;background:var(--bg);color:var(--text);min-height:800px;padding-bottom:90px}button,input,select{font:inherit}button,select{cursor:pointer;background:#222838;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 13px}button:hover{border-color:var(--purple)}button.active,.primary{background:#5e47a4;border-color:#9d85e5}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #cfbdff;outline-offset:3px}header{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:17px 30px;flex-wrap:wrap}header strong{font-size:18px}nav{display:flex;gap:20px;color:var(--dim)}nav span:last-child{color:var(--purple)}main{max-width:1180px;margin:auto;padding:32px}h1{font-size:30px;letter-spacing:-1px;margin:6px 0 10px}h2{font-size:18px;margin:0 0 18px}h3{margin:0 0 8px;font-size:15px}p{line-height:1.6}small,.dim{color:var(--dim)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--purple)}.toolbar,.spread{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.toolbar{margin-bottom:28px}.period{display:flex;align-items:center;gap:10px}.banner{background:#242135;border:1px solid #51436f;border-radius:8px;padding:12px 16px;margin:18px 0;color:#d6c9f6;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.65fr 1fr;gap:22px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:12px}.number{font-size:34px;font-weight:650;letter-spacing:-1px;margin:12px 0}.number small{font-size:14px;font-weight:400;letter-spacing:0}.track{height:7px;background:#303647;border-radius:8px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--purple);border-radius:8px}.green{color:var(--green)}.pill{display:inline-block;font-size:11px;border:1px solid #435247;border-radius:20px;padding:4px 8px;color:var(--green)}table{border-collapse:collapse;width:100%;text-align:left}td,th{border-bottom:1px solid var(--line);padding:15px 8px;font-size:13px}th{font-weight:500;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}td:first-child{padding-left:0}td:last-child,th:last-child{text-align:right}.bars{display:flex;gap:18px;height:175px;align-items:flex-end;margin:18px 0 10px}.daybar{flex:1;text-align:center;font-size:11px;color:var(--dim)}.bar{background:#9277de;border-radius:5px 5px 0 0;margin:6px auto;width:70%;min-height:3px}.row{border-bottom:1px solid var(--line);padding:15px 0}.row:last-child{border:0}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.ledger{display:grid;grid-template-columns:230px 1fr;gap:24px}.ledger aside{border-right:1px solid var(--line);padding-right:22px}.ledger aside button{display:block;width:100%;text-align:left;margin:10px 0}.timeline{border-left:2px solid #65568e;padding-left:24px;margin-left:8px}.timeline article{padding:0 0 22px;position:relative}.timeline article:before{content:'';position:absolute;left:-31px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--purple)}.reading{max-width:800px;margin:auto}.reading h1{font-size:42px}.reading .chapter{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:30px 0;border-bottom:1px solid var(--line)}.chapter .step{font-size:27px;color:#78669d}.bigquote{font-size:26px;line-height:1.4;letter-spacing:-.5px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--popover,#f0eaff);color:var(--popover-foreground,#23183c);padding:8px;border:1px solid var(--border,#7c6e99);box-shadow:0 6px 30px #0007;border-radius:30px;display:flex;align-items:center;gap:14px;z-index:20;white-space:nowrap}.switcher button{background:#342c48;color:white;border:0;border-radius:50%;padding:8px 13px}.state{font:11px ui-monospace,monospace;margin-top:28px;color:var(--dim);overflow-wrap:anywhere}dialog{background:#191d28;color:#e8eaf2;border:1px solid #61527d;border-radius:12px;max-width:440px;padding:28px}dialog::backdrop{background:#0009}input{background:#101219;color:#e8eaf2;padding:9px;border:1px solid #61527d;border-radius:6px;width:100%;margin:10px 0}footer{padding-top:24px;font-size:12px;color:var(--dim)}@media(max-width:750px){main{padding:20px}.grid,.two,.ledger{grid-template-columns:1fr}.ledger aside{border:0;padding:0}.ledger aside button{display:inline-block;width:auto}.reading h1{font-size:32px}.card{padding:16px}header{padding:16px;gap:16px}nav{gap:12px;font-size:12px}.tablewrap{overflow:auto}.switcher{font-size:12px;gap:8px}.bars{gap:8px}}
</style>
<div class="mock"><header><strong>TimeTrace</strong><nav aria-label="App context"><span>Calendar</span><span>Tasks</span><span>Timer</span><span>Statistics</span><span>Weekly review · concept</span></nav></header><main id="app"></main></div>
<div class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant" aria-live="polite"></span><button id="next" aria-label="Next variant">→</button></div>
<dialog id="edit"><h2>Edit weekly goal</h2><p>Prototype only. Changes stay in memory and affect this sample week, not historical targets.</p><label>Hours<input id="target" type="number" min="1" max="168" step="0.5"></label><button id="save" class="primary">Apply to sample</button> <button id="cancel">Cancel</button></dialog>
<dialog id="detail"><h2 id="detail-title"></h2><p id="detail-text"></p><button id="close-detail">Close</button></dialog>
<script>
const names={A:'Weekly overview',C:'Guided review'};
let overviewScroll=0;
const state={variant:new URLSearchParams(location.search).get('variant')||'A',weeklyTarget:20,day:'Wednesday',week:0};
if(!names[state.variant])state.variant='A';
const taskRows=[['Design study','8h','Weekly · 8 / 10h','Estimate · 8 / 12h'],['Build prototype','6h','Daily · 2 / 2h','Estimate · 6 / 8h'],['Reading','4h','Total · 14 / 20h','No estimate'],['Taskless work','3h','Daily / weekly only','No task assigned']];
const title=()=>`<div class="toolbar"><div><div class="eyebrow">Personal goals / recorded work</div><h1 tabindex="-1">${state.variant==='C'?'Review your week.':'Your week, in perspective.'}</h1><small>${state.week===0?'16–22 November 2026':'9–15 November 2026'} · UTC · Monday start · synthetic data</small></div><div class="period">${state.variant==='C'?'<button data-action="overview">← Back to overview</button>':'<button class="primary" data-action="review">Review this week →</button>'}<button data-action="week">${state.week===0?'← Previous week':'Current week →'}</button><button data-action="goal">Edit weekly goal</button></div></div>`;
const note=`<div class="banner">Summed recorded work: overlapping entries count in full, including within the same task. Plans, live timers and uncertain legacy entries are excluded from goal credit in this concept. Legacy treatment is still a proposal.</div>`;
const progress=(value,total)=>`<div class="track"><div class="fill" style="width:${Math.min(100,value/total*100)}%"></div></div>`;
const taskTable=()=>`<div class="tablewrap"><table><thead><tr><th>Task</th><th>This week</th><th>Goal progress</th><th>Existing estimate</th></tr></thead><tbody>${taskRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const bars=()=>`<div class="bars">${[4,3,5,4,3,2,0].map((n,i)=>`<div class="daybar">${n}h<div class="bar" style="height:${n*23}px"></div>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div>`).join('')}</div><small>Daily goal: 4h · Wed includes 1h of overlapping work.</small>`;
const links=()=>`<div class="links"><button data-open="reviews">Review notes & ratings</button><button data-open="statistics">Explore statistics</button><button data-open="calendar">Inspect plans & work</button></div>`;
function VariantA(){return title()+note+`<div class="grid"><section class="card"><small>Weekly goal · summed work</small><div class="number">21h <small>/ ${state.weeklyTarget}h</small></div>${progress(21,state.weeklyTarget)}<span class="pill">${Math.round(2100/state.weeklyTarget)}% of target</span> <small>Includes 3h taskless</small></section><section class="card"><small>Elapsed recorded time · comparison</small><div class="number">18h</div><small>Overlaps merged across all tasks.<br>Not the basis of your goals.</small></section><section class="card"><small>Daily goals reached</small><div class="number">3 <small>/ 7 days</small></div><small>Mon, Wed and Thu reached 4h.<br>Work can continue above the target.</small></section></div><div class="two"><section class="card"><div class="spread"><h2>Your daily rhythm</h2><small>Summed work</small></div>${bars()}</section><section class="card"><h2>Plans are not work</h2><div class="row spread"><span>Original plan</span><b>24h</b></div><div class="row spread"><span>Current schedule</span><b>22h</b></div><div class="row spread"><span>Recorded work · summed</span><b>21h</b></div><small>Separate evidence, not an adherence score.</small></section></div><section class="card" style="margin-top:22px"><h2>Where your time went</h2>${taskTable()}${links()}</section>`}
function VariantB(){return title()+`<div class="ledger"><aside><div class="eyebrow">Week at a glance</div><div class="number">21h <small>/ ${state.weeklyTarget}h</small></div>${progress(21,state.weeklyTarget)}<p class="dim">Summed recorded work<br>18h elapsed · 3h taskless</p>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((d,i)=>`<button data-day="${d}" class="${state.day===d?'active':''}">${d} <small>· ${[4,3,5,4,3,2,0][i]}h</small></button>`).join('')}</aside><section><div class="spread"><div><div class="eyebrow">Daily detail</div><h1>${state.day}</h1></div><span class="pill">${['Monday','Wednesday','Thursday'].includes(state.day)?'Daily goal reached':'Below daily target'}</span></div>${note}${state.day==='Wednesday'?`<div class="timeline"><article><small>09:00–11:00 · 2h</small><h3>Design study</h3><p class="dim">Explore navigation and goal placement.</p></article><article><small>10:00–12:00 · 2h</small><h3>Build prototype</h3><p class="dim">Overlaps Design study by 1h. Both entries count in full.</p></article><article><small>14:00–15:00 · 1h</small><h3>Taskless work</h3><p class="dim">Unassigned, but included in daily and weekly goals.</p></article></div><div class="card spread"><span>Daily goal · 4h</span><b>5h summed / 4h elapsed</b></div>`:`<div class="card"><h2>${state.day} summary</h2><p>Recorded work: ${[4,3,5,4,3,2,0][['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].indexOf(state.day)]}h summed.</p><p class="dim">Select Wednesday for the detailed overlap example.</p></div>`}<details style="margin-top:24px"><summary>Weekly task goals & estimates</summary>${taskTable()}</details>${links()}</section></div>`}
function VariantC(){return `<div class="reading">${title()}<p class="dim">A focused look at the same week. No separate journal, no new calculations, and no automatic review submission.</p><div class="eyebrow">A quiet weekly check-in</div><div class="chapter"><span class="step">01</span><section><h2>What did you put in?</h2><p class="bigquote">You recorded <b>21 hours</b> against a <b>${state.weeklyTarget}-hour</b> weekly goal.</p>${progress(21,state.weeklyTarget)}<p class="dim">3 of 7 daily goals reached. 3h was taskless work.</p>${note}<details><summary>See the daily breakdown</summary>${bars()}</details></section></div><div class="chapter"><span class="step">02</span><section><h2>Where did your attention go?</h2>${taskRows.map(r=>`<div class="row"><div class="spread"><h3>${r[0]}</h3><b>${r[1]}</b></div><small>${r[2]} · ${r[3]}</small></div>`).join('')}<p class="dim">Goals express desired effort; estimates remain a separate work-budget comparison.</p></section></div><div class="chapter"><span class="step">03</span><section><h2>How did reality differ from the plan?</h2><p>24h originally planned → 22h currently scheduled.</p><p>21h summed recorded work covers 18h of elapsed time.</p><small>No inference that scheduled work was performed.</small></section></div><div class="chapter"><span class="step">04</span><section><h2>Make sense of your week</h2><p class="dim">Read or edit your existing day and task reviews. This concept does not create another review journal or generate an AI summary.</p>${links()}<div class="links"><button class="primary" data-action="overview">Return to weekly overview</button></div></section></div></div>`}
function render(){document.querySelector('#app').innerHTML=({A:VariantA,C:VariantC}[state.variant])()+`<footer>THROWAWAY PROTOTYPE · no real data or writes · sample goals are not defaults · separate-screen placement still under discussion.</footer><div class="state">Visible state: ${JSON.stringify(state)} · basis=sum of recorded intervals · period=local start day · historical targets preserved · notifications=off</div>`;document.querySelector('#variant').textContent=`A + C flow · ${names[state.variant]}`}
function show(view,push=true){if(state.variant==='A')overviewScroll=window.scrollY;state.variant=view;const url=new URL(location.href);url.searchParams.set('variant',view);if(push)history.pushState(null,'',url);render();document.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,view==='A'?overviewScroll:0)}
function cycle(){show(state.variant==='A'?'C':'A')}
window.addEventListener('popstate',()=>show(new URLSearchParams(location.search).get('variant')==='C'?'C':'A',false));
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});
document.querySelector('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='review'){show('C');return}if(b.dataset.action==='overview'){show('A');return}if(b.dataset.day){state.day=b.dataset.day;render()}if(b.dataset.action==='week'){document.querySelector('#detail-title').textContent='Browse previous weeks';document.querySelector('#detail-text').textContent='Navigation sketch only: a real previous week would show its own work and historical goal targets. This prototype contains one sample week.';document.querySelector('#detail').showModal()}if(b.dataset.action==='goal'){document.querySelector('#target').value=state.weeklyTarget;document.querySelector('#edit').showModal()}if(b.dataset.open){document.querySelector('#detail-title').textContent={reviews:'Existing Revision screen',statistics:'Existing statistics dashboards',calendar:'Existing Calendar'}[b.dataset.open];document.querySelector('#detail-text').textContent='Prototype navigation preview only. In the app, this opens the existing screen with the selected week or task context. No production navigation or mutation occurs here.';document.querySelector('#detail').showModal()}};
document.querySelector('#cancel').onclick=()=>document.querySelector('#edit').close();document.querySelector('#save').onclick=()=>{const n=Number(document.querySelector('#target').value);if(n>0&&n<=168){state.weeklyTarget=n;document.querySelector('#edit').close();render()}};document.querySelector('#close-detail').onclick=()=>document.querySelector('#detail').close();render();
</script></html>
