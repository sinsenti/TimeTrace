<!-- Zoom-Safe Task Modal Partial -->
<div id="task_modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-[var(--bg-card)] border border-[var(--border-muted)] w-full max-w-[440px] max-h-[95vh] overflow-y-auto rounded-xl p-5 shadow-2xl space-y-3 text-white">
        <div class="flex justify-between items-center border-b border-[var(--border-muted)] pb-2">
            <h3 id="modal_task_title" class="font-bold text-lg text-white">Task Details</h3>
            <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
        </div>
        <input type="hidden" id="edit_task_id">
        <div>
            <label class="text-xs text-slate-400 block mb-1">Task Title / Code (Use [30min] or [1h] for estimation)</label>
            <input id="modal_input_title" type="text" placeholder="e.g. Refactor API [45min]" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-3 py-2 rounded-lg text-sm text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
            <label class="text-xs text-slate-400 block mb-1">Description (Markdown Supported)</label>
            <textarea id="modal_input_desc" rows="4" placeholder="Task description, bullet points, links..." class="w-full bg-[#0f1016] border border-[var(--border-muted)] p-2.5 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500 font-sans leading-relaxed"></textarea>
        </div>
        <div>
            <label class="text-xs text-slate-400 block mb-1">Default Tags</label>
            <input id="modal_input_tags" type="text" placeholder="e.g. #programming #backend" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-3 py-2 rounded-lg text-xs text-purple-300 focus:outline-none focus:border-purple-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
                <label class="text-xs text-slate-400 block mb-1">Assigned Target Day</label>
                <input id="modal_input_assigned_date" type="date" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-1.5 rounded-lg text-xs text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Optional Due Date</label>
                <input id="modal_input_due_date" type="datetime-local" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-1.5 rounded-lg text-xs text-white">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <div>
                <label class="text-xs text-slate-400 block mb-1">Priority</label>
                <select id="modal_input_priority" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-2 rounded-lg text-xs text-white">
                    <option value="-">- (None)</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Status</label>
                <select id="modal_input_status" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-2 rounded-lg text-xs text-white">
                    <option value="To Do">To Do</option>
                    <option value="Ongoing">Ongoing</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Done">Done</option>
                    <option value="Backlog">Backlog</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Category</label>
                <select id="modal_input_category" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-2 rounded-lg text-xs text-white">
                    <option value="work">work</option>
                    <option value="family">family</option>
                    <option value="personal">personal</option>
                    <option value="study">study</option>
                </select>
            </div>
        </div>

        <div>
            <label class="text-xs text-slate-400 block mb-1">Estimated Duration</label>
            <select id="modal_input_est" class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-2 py-2 rounded-lg text-xs text-white">
                <option value="15">15 mins</option>
                <option value="30">30 mins</option>
                <option value="45">45 mins</option>
                <option value="60">60 mins</option>
                <option value="90">90 mins</option>
                <option value="120">120 mins</option>
            </select>
        </div>

        <div>
            <label class="text-xs text-slate-400 block mb-1">Attachments / Links</label>
            <input id="modal_input_attachments" type="text" placeholder="https://github.com/PR/123 or file paths..." class="w-full bg-[#0f1016] border border-[var(--border-muted)] px-3 py-1.5 rounded-lg text-xs text-blue-300 focus:outline-none">
        </div>

        <div class="space-y-2 p-2.5 bg-[#0f1016] rounded-lg border border-[var(--border-muted)]">
            <label class="flex items-center justify-between cursor-pointer">
                <div>
                    <span class="font-bold text-slate-200 block text-xs">Is Recurrent Task</span>
                    <span class="text-[10px] text-slate-400">Re-queues task for next date upon completion</span>
                </div>
                <input id="modal_input_is_recurring" type="checkbox" onchange="toggleRecurrenceRuleSelect(this.checked)" class="w-4 h-4 accent-purple-600 rounded cursor-pointer">
            </label>

            <div id="recurrence_rule_container" class="pt-2 border-t border-[#1f2230] hidden">
                <label class="text-[11px] text-purple-300 font-semibold block mb-1">Recurrence Frequency</label>
                <select id="modal_input_recurrence_rule" class="w-full bg-[#161824] border border-[var(--border-muted)] px-2.5 py-1.5 rounded-lg text-xs text-white focus:outline-none focus:border-purple-500 font-bold">
                    <option value="daily">Once per day (Daily)</option>
                    <option value="weekdays">Weekdays (Mon - Fri)</option>
                    <option value="weekly">Once per week (Weekly)</option>
                    <option value="monthly">Once per month (Monthly)</option>
                </select>
            </div>
        </div>

        <label class="flex items-center justify-between p-2 bg-[#0f1016] rounded-lg border border-[var(--border-muted)] cursor-pointer">
            <div>
                <span class="font-bold text-slate-200 block text-xs">Require Session Review</span>
                <span class="text-[10px] text-slate-400">Sessions attached to this task will need review</span>
            </div>
            <input id="modal_input_requires_review" type="checkbox" checked class="w-4 h-4 accent-purple-600 rounded">
        </label>

        <div class="pt-1">
            <label class="text-xs text-slate-400 block mb-1">Task Color Mode</label>
            <div class="flex items-center space-x-2">
                <select id="modal_input_color_mode" onchange="toggleCustomColorPicker(this.value)" class="bg-[#0f1016] border border-[var(--border-muted)] px-2 py-1.5 rounded-lg text-xs text-white focus:outline-none flex-1">
                    <option value="auto">Auto (Adapts to Theme)</option>
                    <option value="custom">Custom Color</option>
                </select>
                <div id="custom_color_container" class="flex items-center space-x-2 hidden">
                    <input id="modal_input_color" type="color" value="#7c3aed" class="w-8 h-8 bg-transparent border border-[var(--border-muted)] rounded cursor-pointer p-0.5">
                    <span id="custom_color_hex" class="text-xs font-mono text-slate-300">#7C3AED</span>
                </div>
            </div>
            <div id="color_swatches_container" class="flex flex-wrap gap-1.5 mt-2 hidden">
                <span class="text-[10px] text-slate-400 w-full">Presets:</span>
                <div id="swatch_list" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <div class="flex justify-between items-center pt-2">
            <button id="modal_delete_btn" onclick="deleteTask()" class="bg-red-900/40 hover:bg-red-800 text-red-300 border border-red-700/50 px-3 py-1.5 rounded-lg text-xs font-semibold hidden">Delete</button>
            <div class="flex items-center space-x-2 ml-auto">
                <button onclick="closeTaskModal()" class="bg-[#222536] hover:bg-[#2d3046] text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center">Cancel <kbd class="text-[9px] opacity-70 font-mono bg-black/20 px-1 rounded ml-1">Esc</kbd></button>
                <button onclick="saveTask()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-3.5 py-1.5 rounded-lg text-xs flex items-center">Save <kbd class="text-[9px] opacity-70 font-mono bg-black/20 px-1 rounded ml-1">Ctrl+↵</kbd></button>
            </div>
        </div>
    </div>
</div>
