<!-- Completion Policy Prompt Modal -->
<div id="completion_policy_modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
    <div class="bg-[var(--bg-card)] border border-[var(--border-muted)] w-[420px] rounded-xl p-5 shadow-2xl space-y-4 text-white">
        <div class="flex justify-between items-center border-b border-[var(--border-muted)] pb-2">
            <h3 id="completion_policy_modal_title" class="font-bold text-base text-amber-400">Task completed</h3>
            <button type="button" onclick="closeCompletionPolicyModal()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
        </div>

        <p class="text-xs text-slate-300 leading-relaxed">This task still has scheduled sessions on the calendar. Clear them?</p>

        <div id="completion_policy_session_list" class="space-y-1.5 max-h-52 overflow-y-auto pr-1"></div>

        <div id="completion_policy_subtask_row" class="hidden pt-1 border-t border-[var(--border-muted)]">
            <label class="flex items-center space-x-2 text-xs text-slate-300 pt-2 cursor-pointer">
                <input type="checkbox" id="completion_policy_include_subtasks" class="w-4 h-4 accent-purple-600 cursor-pointer rounded">
                <span id="completion_policy_subtask_label"></span>
            </label>
        </div>

        <div class="flex justify-end space-x-2 pt-2 border-t border-[var(--border-muted)]">
            <button type="button" onclick="closeCompletionPolicyModal()" class="bg-[#222536] hover:bg-[#2d3046] text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium">Keep them</button>
            <button type="button" onclick="clearCompletionPolicySessions()" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-1.5 rounded-lg text-xs">Clear selected</button>
        </div>
    </div>
</div>
