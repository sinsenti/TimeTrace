<!-- Persistent AI Assistant drawer (docs/ai-assistant-spec.md S5). Included on all current page
     templates. Toggled by the navbar launcher button and Ctrl+Shift+A (NOT Ctrl+K -- that
     collides with vim_engine.js's case 'k'). All model-generated text is rendered via
     textContent in ai_assistant.js/ai_insights.js/ai_drafts.js -- never innerHTML, never Markdown-parsed
     (spec S9.5). -->
<div id="ai_drawer" class="text-white">

    <!-- Only populated/shown in full-screen mode, and only on a page that has a calendar (the
         dashboard's #calendar/`calendar` FullCalendar instance is physically MOVED in here --
         see aiEnterFullscreen in ai_assistant.js -- rather than building a second calendar
         instance). Empty and hidden the rest of the time. -->
    <div id="ai_drawer_calendar_pane" class="ai-drawer-calendar-pane hidden"></div>

    <div id="ai_drawer_chat_column" class="ai-drawer-chat-column">
        <!-- In normal mode this sits at the drawer's own left edge (the chat column fills the
             whole drawer); in full-screen mode this same edge IS the calendar/chat boundary --
             see ai.css .ai-drawer-chat-column { position: relative } and aiSetupDrawerResize. -->
        <div id="ai_drawer_resize_handle" class="ai-drawer-resize-handle" title="Drag to resize"></div>
        <div class="ai-drawer-header">
            <span class="ai-drawer-title">Assistant</span>
            <select id="ai_conversation_select" class="ai-conversation-select"></select>
            <div class="ai-drawer-header-actions">
                <button type="button" id="ai_rename_conversation_btn" class="ai-icon-btn" title="Rename conversation">Rename</button>
                <button type="button" id="ai_new_conversation_btn" class="ai-icon-btn" title="New conversation">+ New</button>
                <button type="button" id="ai_drafts_toggle_btn" class="ai-icon-btn" title="Show pending drafts / undo history">Drafts</button>
                <button type="button" id="ai_fullscreen_toggle_btn" class="ai-icon-btn" title="Toggle full screen">Fullscreen</button>
                <button type="button" id="ai_drawer_close_btn" class="ai-icon-btn" title="Close (Esc)">&times;</button>
            </div>
        </div>

        <section id="ai_quick_actions" class="ai-quick-actions" aria-label="Assistant quick actions">
            <div class="ai-quick-actions-heading">Quick actions</div>
            <div class="ai-quick-actions-list">
                <button type="button" id="ai_action_daily_briefing" class="ai-quick-action" data-ai-action="daily-briefing">
                    Daily briefing
                </button>
                <button type="button" id="ai_action_weekly_review" class="ai-quick-action" data-ai-action="weekly-review"
                        aria-controls="ai_weekly_review_panel" aria-expanded="false">
                    Weekly review
                </button>
                <button type="button" id="ai_action_plan_rest_today" class="ai-quick-action" data-ai-action="plan-rest-today">
                    Plan rest of today
                </button>
                <button type="button" id="ai_action_plan_tomorrow" class="ai-quick-action" data-ai-action="plan-tomorrow">
                    Plan tomorrow
                </button>
                <button type="button" id="ai_action_plan_next_week" class="ai-quick-action" data-ai-action="plan-next-week">
                    Plan next week
                </button>
            </div>
        </section>

        <section id="ai_weekly_review_panel" class="ai-weekly-review-panel hidden" aria-labelledby="ai_weekly_review_title">
            <div class="ai-weekly-review-header">
                <div>
                    <h2 id="ai_weekly_review_title" class="ai-weekly-review-title">Weekly review</h2>
                    <div id="ai_weekly_review_range" class="ai-weekly-review-range"></div>
                    <div id="ai_weekly_review_timezone" class="ai-weekly-review-timezone"></div>
                </div>
                <button type="button" id="ai_weekly_review_refresh_btn" class="ai-icon-btn" aria-label="Refresh weekly review">
                    Refresh
                </button>
            </div>
            <div id="ai_weekly_review_status" class="ai-weekly-review-status" role="status" aria-live="polite"></div>
            <div id="ai_weekly_review_loading" class="ai-weekly-review-state ai-weekly-review-loading hidden">Loading weekly review...</div>
            <div id="ai_weekly_review_empty" class="ai-weekly-review-state ai-weekly-review-empty hidden">
                No logged or future scheduled activity in this week yet.
            </div>
            <div id="ai_weekly_review_error" class="ai-weekly-review-state ai-weekly-review-error hidden" role="alert"></div>
            <div id="ai_weekly_review_content" class="ai-weekly-review-content hidden"></div>
            <div id="ai_weekly_review_actions" class="ai-weekly-review-actions hidden">
                <button type="button" id="ai_weekly_review_ask_btn" class="ai-btn ai-btn-ask">
                    Ask assistant
                </button>
            </div>
        </section>

        <div id="ai_drawer_body" class="ai-drawer-body">
            <div id="ai_thread" class="flex flex-col gap-2" style="display: contents;"></div>
        </div>

        <div id="ai_drafts_panel" class="ai-drawer-body hidden" style="flex-direction: column;">
            <div class="flex items-center justify-between mb-1">
                <span class="ai-drawer-title" style="font-size: 11px;">Draft batches</span>
                <button type="button" id="ai_undo_all_btn" class="ai-icon-btn" title="Undo every undoable batch">Undo all</button>
            </div>
            <div id="ai_batches_list" class="flex flex-col gap-2"></div>
        </div>

        <div class="ai-drawer-composer">
            <textarea id="ai_composer_input" rows="1" placeholder="Ask the assistant... (e.g. 'brief me for today' or 'replan this week')"></textarea>
            <button type="button" id="ai_composer_send" title="Send (Enter)">Send</button>
        </div>
    </div>
</div>
