<!-- Widget builder / editor.
     Structured mode: source x measure x group-by x filter x chart, validated through
     POST /analytics/query before it is saved as a dashboard widget.
     SQL mode: read-only SELECT against the allowlisted analytics tables, previewed through
     POST /analytics/sql. The whole SQL tab is hidden unless GET /analytics/capabilities
     reports sql_enabled (TIMETRACE_SQL_WIDGETS_ENABLED).
     Logic lives in /static/js/widget_builder.js. -->
<div id="widget_builder_modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-[var(--bg-card)] border border-[var(--border-muted)] w-full max-w-[560px] max-h-[95vh] overflow-y-auto rounded-xl p-5 shadow-2xl space-y-4 text-white">
        <div class="flex justify-between items-center border-b border-[var(--border-muted)] pb-3">
            <h3 id="wb_heading" class="font-bold text-base text-white">Add Widget</h3>
            <button type="button" onclick="closeWidgetBuilder()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
        </div>

        <div class="space-y-3 text-xs">
            <div>
                <label class="font-bold text-slate-300 block mb-1">Title</label>
                <input id="wb_title" type="text" placeholder="e.g. Focus time by category"
                       class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Card width</label>
                    <select id="wb_width"
                            class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                        <option value="half" selected>Half</option>
                        <option value="full">Full</option>
                    </select>
                </div>
                <div id="wb_mode_tabs" class="hidden">
                    <label class="font-bold text-slate-300 block mb-1">Definition</label>
                    <div class="flex gap-1">
                        <button id="wb_tab_structured" type="button" onclick="wbSwitchMode('structured')"
                                class="flex-1 h-[30px] rounded border border-[var(--border-muted)] font-bold">Builder</button>
                        <button id="wb_tab_sql" type="button" onclick="wbSwitchMode('sql')"
                                class="flex-1 h-[30px] rounded border border-[var(--border-muted)] font-bold">SQL</button>
                    </div>
                </div>
            </div>

            <!-- ---------------- Structured mode ---------------- -->
            <div id="wb_pane_structured" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Source</label>
                        <select id="wb_source" onchange="_onWidgetBuilderSourceChange()"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Measure</label>
                        <select id="wb_measure"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Group by</label>
                        <select id="wb_group_by_1" onchange="wbOnGroupByChange()"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Then by (optional)</label>
                        <select id="wb_group_by_2"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Chart</label>
                        <select id="wb_chart"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="tile">Tile (single number)</option>
                            <option value="bar" selected>Bar</option>
                            <option value="line">Line</option>
                            <option value="doughnut">Doughnut</option>
                            <option value="table">Table</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Date range</label>
                        <select id="wb_date_range" onchange="wbOnComparisonChange()"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="all_time" selected>All time</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last_7_days">Last 7 days</option>
                            <option value="last_14_days">Last 14 days</option>
                            <option value="last_30_days">Last 30 days</option>
                            <option value="this_week">This week</option>
                            <option value="this_month">This month</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-slate-300 block mb-1">Tag attribution <span class="text-slate-500 font-normal">(only matters when grouping by tag)</span></label>
                    <select id="wb_tag_attribution"
                            class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                        <option value="fan_out" selected>Fan-out (full duration credited to each tag)</option>
                        <option value="split_evenly">Split evenly (reconciles pie totals)</option>
                    </select>
                </div>

                <!-- Comparison baseline. Not offered for SQL widgets: the SQL engine cannot
                     shift date bounds it does not understand the shape of. -->
                <div class="bg-[#0f1016] p-2.5 rounded-lg border border-[var(--border-muted)] space-y-2">
                    <label class="font-bold text-slate-300 block">Compare against</label>
                    <select id="wb_comparison" onchange="wbOnComparisonChange()"
                            class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                        <option value="none" selected>None</option>
                        <option value="previous_period">Previous period</option>
                        <option value="same_period_last_year">Same period last year</option>
                        <option value="custom">Custom range</option>
                    </select>
                    <div id="wb_comparison_custom" class="grid grid-cols-2 gap-2 hidden">
                        <input id="wb_comparison_start" type="date"
                               class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                        <input id="wb_comparison_end" type="date"
                               class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                    </div>
                    <div id="wb_comparison_note" class="text-[11px] text-slate-400 hidden"></div>
                </div>

                <div class="bg-[#0f1016] p-2.5 rounded-lg border border-[var(--border-muted)] space-y-2">
                    <label class="font-bold text-slate-300 block">Filter (optional)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <select id="wb_filter_field"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                        <select id="wb_filter_op"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="eq" selected>=</option>
                            <option value="neq">!=</option>
                            <option value="gt">&gt;</option>
                            <option value="gte">&gt;=</option>
                            <option value="lt">&lt;</option>
                            <option value="lte">&lt;=</option>
                            <option value="contains">contains</option>
                            <option value="in">in (comma-separated)</option>
                            <option value="not_in">not in (comma-separated)</option>
                            <option value="is_null">is empty</option>
                            <option value="is_not_null">is not empty</option>
                        </select>
                        <input id="wb_filter_value" type="text" placeholder="value"
                               class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- ---------------- SQL mode ---------------- -->
            <div id="wb_pane_sql" class="space-y-3 hidden">
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Query <span class="text-slate-500 font-normal">(read-only, single SELECT statement, no parameters)</span></label>
                    <textarea id="wb_sql" rows="7" spellcheck="false" placeholder="SELECT date(start_time) AS day, round(sum(duration_seconds)/3600.0, 2) AS hours&#10;FROM session&#10;GROUP BY day&#10;ORDER BY day"
                              class="w-full bg-[#0f1016] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded font-mono text-[11px] focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Row limit</label>
                        <input id="wb_sql_limit" type="number" min="1" value="200"
                               class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Chart</label>
                        <select id="wb_sql_chart" onchange="wbOnSqlChartChange()"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="table" selected>Table</option>
                            <option value="bar">Bar</option>
                            <option value="line">Line</option>
                            <option value="doughnut">Doughnut</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="wbRunSqlPreview()"
                                class="w-full h-[30px] bg-[#181a28] hover:bg-[#222536] text-purple-300 border border-[var(--border-muted)] font-bold rounded transition">
                            Run preview
                        </button>
                    </div>
                </div>

                <div id="wb_sql_columns" class="grid grid-cols-2 gap-2 hidden">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Label column</label>
                        <select id="wb_sql_label_column"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Value column</label>
                        <select id="wb_sql_value_column"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                </div>

                <div id="wb_sql_preview" class="hidden bg-[#0f1016] border border-[var(--border-muted)] rounded-lg p-2 max-h-56 overflow-auto">
                    <table class="w-full text-[11px] text-slate-300">
                        <thead><tr id="wb_sql_preview_head" class="text-slate-400 font-bold"></tr></thead>
                        <tbody id="wb_sql_preview_body"></tbody>
                    </table>
                </div>
                <div id="wb_sql_meta" class="text-[11px] text-slate-500"></div>

                <div class="border border-[var(--border-muted)] rounded-lg">
                    <button type="button" onclick="wbToggleSchema()"
                            class="w-full text-left px-2.5 py-1.5 font-bold text-slate-300 hover:text-white">
                        Schema reference
                    </button>
                    <div id="wb_sql_schema" class="hidden px-2.5 pb-2 max-h-48 overflow-auto text-[11px] text-slate-400 font-mono space-y-1"></div>
                </div>
            </div>

            <div id="wb_error" class="text-red-400 font-semibold hidden"></div>
        </div>

        <div class="flex justify-end space-x-2 border-t border-[var(--border-muted)] pt-3">
            <button type="button" onclick="closeWidgetBuilder()"
                    class="h-8 bg-[#181a28] hover:bg-[#222536] text-slate-300 border border-[var(--border-muted)] font-bold px-3.5 rounded-lg transition text-xs">
                Cancel
            </button>
            <button id="wb_submit" type="button" onclick="submitWidgetBuilder()"
                    class="h-8 bg-purple-600 hover:bg-purple-500 text-white font-bold px-3.5 rounded-lg transition text-xs">
                Add Widget
            </button>
        </div>
    </div>
</div>
