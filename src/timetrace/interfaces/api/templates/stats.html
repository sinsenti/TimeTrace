<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTrace Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/ai.css">
    <style>
        :root[data-theme="midnight"] {
            --bg-main: #0b0c10; --bg-header: #12131d; --bg-card: #12131d; --border-color: #1a1c26; --border-muted: #262938; --text-main: #e2e8f0;
        }
        :root[data-theme="nord"] {
            --bg-main: #2e3440; --bg-header: #242933; --bg-card: #242933; --border-color: #434c5e; --border-muted: #4c566a; --text-main: #eceff4;
        }
        :root[data-theme="dracula"] {
            --bg-main: #282a36; --bg-header: #21222c; --bg-card: #21222c; --border-color: #44475a; --border-muted: #6272a4; --text-main: #f8f8f2;
        }
        :root[data-theme="cyberpunk"] {
            --bg-main: #0d0221; --bg-header: #150538; --bg-card: #150538; --border-color: #2b0b5c; --border-muted: #ff0055; --text-main: #ffffff;
        }
        :root[data-theme="monokai"] {
            --bg-main: #2d2a2e; --bg-header: #221f22; --bg-card: #3a373d; --border-color: #4a474f; --border-muted: #5b5760; --text-main: #fcfcfa;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
        .widget-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.25rem; transition: border-color 0.2s; }
        .widget-card:hover { border-color: #3b82f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border-muted); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <header class="bg-[var(--bg-header)] border-b border-[var(--border-color)] px-4 py-2 flex items-center justify-between shrink-0 gap-3 text-xs h-12">
        {% include "components/navbar.html" %}

        <div class="font-bold text-sm text-slate-200">
            Analytics & Performance
        </div>

        <div class="flex items-center space-x-2 text-xs">
            <button onclick="openWidgetBuilder()" class="h-8 bg-[#181a28] hover:bg-[#222536] text-purple-300 border border-[var(--border-muted)] font-bold px-3.5 rounded-lg transition">
                + Add Widget
            </button>
            <button onclick="loadOverviewDashboard()" class="h-8 bg-purple-600 hover:bg-purple-500 text-white font-bold px-3.5 rounded-lg transition">
                Refresh
            </button>
        </div>
    </header>

    <main class="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">
        <!-- Seeded "Overview" dashboard: populated entirely by dashboards.js via
             POST /analytics/query/batch. See OVERVIEW_SEED in dashboards.js. -->
        <div id="widget_grid"></div>

        <!-- User-built widgets (created via the "+ Add Widget" button). Specs are saved to
             localStorage only -- there is no dashboard/widget persistence table yet, so these
             are per-browser, not synced anywhere. See CUSTOM_WIDGETS_KEY in dashboards.js. -->
        <div id="custom_widget_section" class="space-y-3 hidden">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">Your Widgets</h3>
            <div id="custom_widget_grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- Interactive Statistics Item Inspector List -->
        <div id="stats_drilldown_inspector" class="widget-card space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-[var(--border-muted)] pb-2">
                <div>
                    <h3 id="drilldown_title" class="font-bold text-base text-purple-300">Drill-Down Inspection</h3>
                    <p id="drilldown_subtitle" class="text-xs text-slate-400">Represented sessions and tasks</p>
                </div>
                <button onclick="closeDrilldownInspector()" class="text-slate-400 hover:text-white font-bold text-base">&times; Close Inspector</button>
            </div>
            <div id="drilldown_item_list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"></div>
        </div>
    </main>

    <!-- Manual widget builder: source x measure x group-by x filter x chart, run through the
         same /analytics/query engine as the seeded widgets. -->
    <div id="widget_builder_modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-[var(--bg-card)] border border-[var(--border-muted)] w-full max-w-[480px] max-h-[95vh] overflow-y-auto rounded-xl p-5 shadow-2xl space-y-4 text-white">
            <div class="flex justify-between items-center border-b border-[var(--border-muted)] pb-3">
                <h3 class="font-bold text-base text-white">Add Custom Widget</h3>
                <button type="button" onclick="closeWidgetBuilder()" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-slate-300 block mb-1">Title</label>
                    <input id="wb_title" type="text" placeholder="e.g. Focus time by category"
                           class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Source</label>
                        <select id="wb_source" onchange="_onWidgetBuilderSourceChange()"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Measure</label>
                        <select id="wb_measure"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Group by</label>
                        <select id="wb_group_by_1"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Then by (optional)</label>
                        <select id="wb_group_by_2"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Chart</label>
                        <select id="wb_chart"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="tile">Tile (single number)</option>
                            <option value="bar" selected>Bar</option>
                            <option value="line">Line</option>
                            <option value="doughnut">Doughnut</option>
                            <option value="table">Table</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-slate-300 block mb-1">Date range</label>
                        <select id="wb_date_range"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="all_time" selected>All time</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last_7_days">Last 7 days</option>
                            <option value="last_14_days">Last 14 days</option>
                            <option value="last_30_days">Last 30 days</option>
                            <option value="this_week">This week</option>
                            <option value="this_month">This month</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-slate-300 block mb-1">Tag attribution <span class="text-slate-500 font-normal">(only matters when grouping by tag)</span></label>
                    <select id="wb_tag_attribution"
                            class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                        <option value="fan_out" selected>Fan-out (full duration credited to each tag)</option>
                        <option value="split_evenly">Split evenly (reconciles pie totals)</option>
                    </select>
                </div>

                <div class="bg-[#0f1016] p-2.5 rounded-lg border border-[var(--border-muted)] space-y-2">
                    <label class="font-bold text-slate-300 block">Filter (optional)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <select id="wb_filter_field"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none"></select>
                        <select id="wb_filter_op"
                                class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                            <option value="eq" selected>=</option>
                            <option value="neq">!=</option>
                            <option value="gt">&gt;</option>
                            <option value="gte">&gt;=</option>
                            <option value="lt">&lt;</option>
                            <option value="lte">&lt;=</option>
                            <option value="contains">contains</option>
                            <option value="in">in (comma-separated)</option>
                            <option value="not_in">not in (comma-separated)</option>
                            <option value="is_null">is empty</option>
                            <option value="is_not_null">is not empty</option>
                        </select>
                        <input id="wb_filter_value" type="text" placeholder="value"
                               class="w-full bg-[#181a28] border border-[var(--border-muted)] text-white px-2 py-1.5 rounded focus:outline-none">
                    </div>
                </div>

                <div id="wb_error" class="text-red-400 font-semibold hidden"></div>
            </div>

            <div class="flex justify-end space-x-2 border-t border-[var(--border-muted)] pt-3">
                <button type="button" onclick="closeWidgetBuilder()"
                        class="h-8 bg-[#181a28] hover:bg-[#222536] text-slate-300 border border-[var(--border-muted)] font-bold px-3.5 rounded-lg transition text-xs">
                    Cancel
                </button>
                <button type="button" onclick="submitWidgetBuilder()"
                        class="h-8 bg-purple-600 hover:bg-purple-500 text-white font-bold px-3.5 rounded-lg transition text-xs">
                    Add Widget
                </button>
            </div>
        </div>
    </div>

    {% include "components/settings_modal.html" %}
    {% include "components/ai_drawer.html" %}

    <script src="/static/js/api_client.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/timer_control.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/stats.js"></script>
    <script src="/static/js/dashboards.js"></script>
    <script src="/static/js/ai_assistant.js"></script>
    <script src="/static/js/ai_drafts.js"></script>
</body>
</html>
