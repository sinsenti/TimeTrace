[project]
name = "timetrace"
version = "0.1.0"
description = "A local-first, developer-centric time tracking and productivity engine."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "sinsenti", email = "sinsenti73@gmail.com" }
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "typer>=0.15.1",
    "python-frontmatter>=1.1.0",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.5",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.6",
]

[project.scripts]
timetrace = "timetrace.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/timetrace"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "typer.Option",
    "typer.Argument",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
