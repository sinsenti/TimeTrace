[project]
name = "timetrace"
version = "0.1.0"
description = "A local-first, developer-centric time tracking and productivity engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "typer>=0.9.0",
    "textual>=0.52.0",
    "python-frontmatter>=1.1.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
timetrace = "timetrace.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "typer.Option",
    "typer.Argument",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
